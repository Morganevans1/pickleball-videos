<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickleball Recovery Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: coaching board. Controls on the left, the court as the hero, the
   ambition slider on the right edge, numbers and the coach's note underneath. */
:root {
  --bg: #eef3f6;
  --panel: #ffffff;
  --ink: #14232d;
  --muted: #5a6c78;
  --line: #d3dde4;
  --accent: #0b7a83;          /* student teal, readable on light */
  --accent-ink: #ffffff;
  --warn: #b5481f;
  --warn-soft: rgba(214, 92, 50, 0.14);
  --chip: #e3ebf0;

  /* Court (canvas) */
  --surround: #1d4258;
  --court: #2b5f7d;
  --kitchen: #3a7395;
  --court-line: #f4f8fb;
  --net: #0f1d26;
  --ball: #e2f23a;
  --you: #3fd8d0;
  --opp: #ff8a5b;
  --partner: #e8f4f8;        /* partner: pale, ringed in team teal */
  --overlay: rgba(8, 18, 26, 0.55);
  --on-court: #f4f8fb;
  --side-bg: #f7fafc;
  --side-ground: #9fb3c1;
  --side-ink: #5a6c78;

  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d161c; --panel: #142129; --ink: #e6eef3; --muted: #93a6b2; --line: #263843;
    --accent: #3fd8d0; --accent-ink: #082126; --warn: #ff9a73; --warn-soft: rgba(255, 138, 91, 0.16); --chip: #1c2c36;
    --surround: #102633; --court: #22506b; --kitchen: #2e6383; --court-line: #e9f1f6; --net: #05090c;
    --side-bg: #101b22; --side-ground: #3b5262; --side-ink: #93a6b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d161c; --panel: #142129; --ink: #e6eef3; --muted: #93a6b2; --line: #263843;
  --accent: #3fd8d0; --accent-ink: #082126; --warn: #ff9a73; --warn-soft: rgba(255, 138, 91, 0.16); --chip: #1c2c36;
  --surround: #102633; --court: #22506b; --kitchen: #2e6383; --court-line: #e9f1f6; --net: #05090c;
  --side-bg: #101b22; --side-ground: #3b5262; --side-ink: #93a6b2;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.4 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr) 96px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "top top top"
    "panel stage amb"
    "panel summary summary";
  gap: 10px 14px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
.topbar { grid-area: top; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand-mark { width: 14px; height: 14px; border-radius: 50%; background: var(--ball); box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); align-self: center; }
.brand-name { font: 700 22px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.brand-tag { font: 600 12px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.steps { display: flex; gap: 4px; flex: 1; justify-content: center; min-width: 0; flex-wrap: wrap; }
.step {
  display: flex; align-items: center; gap: 8px; border: 0; background: transparent; cursor: pointer;
  padding: 8px 12px; border-radius: 999px; color: var(--muted);
  font: 600 16px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  min-height: 44px;
}
.step-num {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid currentColor; font-size: 14px;
}
.step[aria-current="step"] { background: var(--ink); color: var(--bg); }
.step.done { color: var(--ink); }
.step + .step::before { content: ""; width: 14px; height: 2px; background: var(--line); margin-right: 6px; margin-left: -10px; }

.top-actions { display: flex; gap: 10px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; cursor: pointer;
  padding: 0 16px; min-height: 44px; font: 600 15px/1 var(--font-body); display: inline-flex; align-items: center; gap: 8px;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-play { background: var(--ball); color: #1a2208; border-color: transparent; }
.play-icon { width: 0; height: 0; border-left: 11px solid currentColor; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.btn-play.playing .play-icon { width: 11px; height: 13px; border: 0; border-left: 4px solid currentColor; border-right: 4px solid currentColor; }

.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; border-radius: 999px; padding: 0 14px; min-height: 38px; cursor: pointer;
  font: 600 14px/1 var(--font-body); color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg-wide { display: flex; }
.seg-wide button { flex: 1; padding: 0 6px; }

/* Left panel */
.panel {
  grid-area: panel; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 18px;
  padding-right: 4px;
}
.group { display: flex; flex-direction: column; gap: 8px; }
.group-title {
  margin: 0; font: 700 13px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.select {
  width: 100%; min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px;
}
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.shot-btn {
  min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
  font: 600 17px/1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; color: var(--ink);
}
.shot-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.shot-blurb { margin: 0; color: var(--muted); font-size: 14px; min-height: 2.8em; }

.rating { display: flex; flex-direction: column; gap: 4px; }
.rating-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rating-row label { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.rating output { font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.rating output.pro::after { content: " PRO"; font-size: 12px; letter-spacing: .1em; color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 30px; }
input[type="range"]:disabled { opacity: .4; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot-you { background: var(--you); box-shadow: 0 0 0 1.5px var(--accent); }
.dot-opp { background: var(--opp); }
.check { display: flex; gap: 8px; align-items: center; min-height: 32px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.field-label { font-weight: 600; font-size: 14px; margin-top: 4px; }

/* Stage */
.stage { grid-area: stage; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.court-wrap { position: relative; flex: 1 1 auto; min-height: 220px; border-radius: var(--radius); overflow: hidden; background: var(--surround); }
.side-wrap { flex: 0 0 clamp(110px, 24%, 170px); border-radius: var(--radius); overflow: hidden; background: var(--side-bg); border: 1px solid var(--line); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.badge {
  position: absolute; top: 10px; right: 10px; background: rgba(8, 20, 28, .72); color: #fff; border-radius: 999px;
  padding: 6px 12px; font: 600 13px/1 var(--font-body);
}
.banner {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 24px);
  background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 16px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); text-align: center;
}
.banner.warn { color: var(--warn); }

/* Ambition slider */
.ambition { grid-area: amb; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 0; }
.amb-end { font: 700 14px/1.05 var(--font-display); letter-spacing: .08em; text-transform: uppercase; text-align: center; }
.amb-top { color: var(--ink); }
.amb-bottom { color: var(--muted); }
.amb-track {
  position: relative; flex: 1; width: 46px; border-radius: 999px; background: var(--chip); cursor: pointer;
  touch-action: none; min-height: 160px;
}
.amb-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 999px; background: linear-gradient(to top, color-mix(in srgb, var(--you) 35%, transparent), var(--you)); }
.amb-over {
  position: absolute; left: 0; right: 0; top: 0; border-radius: 999px 999px 0 0;
  background: repeating-linear-gradient(135deg, var(--warn-soft) 0 6px, transparent 6px 12px);
}
.amb-ceiling { position: absolute; left: -8px; right: -8px; height: 0; border-top: 2px dashed var(--warn); }
.amb-ceiling span {
  position: absolute; right: 50%; transform: translate(50%, -130%);
  transition: transform .15s; white-space: nowrap;
  font: 700 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--warn);
  background: var(--bg); padding: 2px 4px; border-radius: 4px;
}
.amb-thumb {
  position: absolute; left: 50%; width: 52px; height: 52px; transform: translate(-50%, 50%); border-radius: 50%;
  background: var(--panel); border: 3px solid var(--accent); display: grid; place-items: center;
  font: 700 22px/1 var(--font-display); box-shadow: 0 2px 8px rgba(0,0,0,.2); pointer-events: none;
}
.amb-thumb.over { border-color: var(--warn); color: var(--warn); }
.amb-ceiling.below span { transform: translate(50%, 40%); }

/* Summary */
.summary { grid-area: summary; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stats { display: flex; gap: 8px 22px; flex-wrap: wrap; align-items: flex-end; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-k { font: 700 11px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat-v { font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pace { display: flex; flex-direction: column; gap: 4px; flex: 1 1 360px; min-width: 0; }
.pace-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.pace-bar span {
  text-align: center; padding: 7px 2px; font: 700 13px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  background: var(--chip); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pace-bar span:first-child { border-radius: 6px 0 0 6px; }
.pace-bar span:last-child { border-radius: 0 6px 6px 0; }
.pace-bar span.lit { background: color-mix(in srgb, var(--accent) 30%, var(--chip)); color: var(--ink); }
.pace-bar span.on { background: var(--accent); color: var(--accent-ink); }
.pace-bar span.on[data-key="impossible"] { background: var(--warn); color: #fff; }
.note { font-size: 16px; line-height: 1.45; max-width: 95ch; min-height: 2.9em; }
.note b { font-weight: 600; }
.predict { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.predict p { margin: 0; flex: 1 1 280px; font-size: 16px; }
.predict-actions { display: flex; gap: 8px; }

/* Keep the top bar on one line at tablet widths */
@media (max-width: 1320px) and (min-width: 901px) {
  .topbar { gap: 10px; }
  .step { padding: 6px 8px; gap: 6px; font-size: 15px; }
  .step + .step::before { display: none; }
  .brand-name { font-size: 20px; }
}
@media (max-width: 1100px) and (min-width: 901px) {
  .step-label { display: none; }
  .step[aria-current="step"] .step-label { display: inline; }
}

/* Format switch sits in the brand row */
.seg-format button { min-height: 34px; font: 700 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 0 12px; }
.brand { align-items: center; flex-wrap: wrap; }
.app:not([data-format="doubles"]) .doubles-only { display: none !important; }
.dot-partner { background: var(--partner); box-shadow: 0 0 0 2px var(--accent); }
.seg-focus { align-self: flex-end; }
.seg-focus button { min-height: 34px; }

/* Help */
.help-wrap { position: relative; }
.btn-help { width: 44px; padding: 0; justify-content: center; font: 700 20px/1 var(--font-display); }
.btn-help.nudge { box-shadow: 0 0 0 3px var(--ball); }
.help-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 240px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 6px; display: flex; flex-direction: column;
}
.help-menu button {
  border: 0; background: transparent; text-align: left; padding: 12px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;
}
.help-menu button:hover, .help-menu button:focus-visible { background: var(--chip); }

/* Dialogs (welcome, legend) */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dialog {
  width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--panel); color: var(--ink);
  border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column;
}
.dialog-legend { width: min(720px, 100%); }
.dialog-body { padding: 24px 24px 8px; display: flex; flex-direction: column; gap: 12px; }
.dialog-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px 20px; flex-wrap: wrap; }
.dialog-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.dialog-title { margin: 0; font: 700 28px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.dialog-kicker { margin: 0; font: 700 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.dialog p { margin: 0; max-width: 62ch; }
.dialog .lead { font-size: 17px; }
.btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--accent); }
.why { display: grid; gap: 12px; margin: 4px 0; padding: 0; list-style: none; }
.why li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.why .num { font: 700 30px/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.why b { display: block; font-weight: 600; }
.audience { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.audience div { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.audience b { display: block; font: 700 12px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.welcome-art { width: 100%; max-width: 100%; height: auto; border-radius: 12px; display: block; }

/* Legend */
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; min-height: 36px; }
.legend svg { width: 64px; height: 30px; border-radius: 6px; background: var(--court); display: block; }
.legend .lg-text { font-size: 14px; line-height: 1.3; }
.legend .lg-text b { font-weight: 600; }
.legend .lg-doubles { grid-column: 1 / -1; }
.legend-group { margin: 6px 0 2px; font: 700 12px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Tour */
.tour { position: fixed; inset: 0; z-index: 60; }
.tour-hole {
  position: fixed; border-radius: 12px; pointer-events: none;
  box-shadow: 0 0 0 4px var(--ball), 0 0 0 9999px var(--overlay);
  transition: left .2s, top .2s, width .2s, height .2s;
}
.tour-card {
  position: fixed; width: min(360px, calc(100vw - 32px)); background: var(--panel); color: var(--ink);
  border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.35); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
}
.tour-count { font: 700 12px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tour-title { margin: 0; font: 700 22px/1.05 var(--font-display); text-transform: uppercase; }
.tour-text, .tour-tip { margin: 0; }
.tour-tip { font-size: 14px; color: var(--muted); border-left: 3px solid var(--ball); padding-left: 10px; }
.tour-tip:empty { display: none; }
@media (prefers-reduced-motion: reduce) { .tour-hole { transition: none; } }

/* Narrow screens: court first, controls below. */
@media (max-width: 900px) {
  html, body { height: auto; }
  .app {
    height: auto;
    grid-template-columns: minmax(0, 1fr) 70px;
    grid-template-rows: auto auto auto auto;
    grid-template-areas: "top top" "stage amb" "summary summary" "panel panel";
  }
  .court-wrap { flex: none; aspect-ratio: 2 / 1; min-height: 0; }
  .side-wrap { flex: none; height: 120px; }
  .amb-track { width: 38px; }
  .amb-thumb { width: 44px; height: 44px; font-size: 18px; }
  .amb-end { font-size: 12px; }
  .topbar { justify-content: space-between; }
  .steps { order: 3; flex: 1 1 100%; justify-content: space-between; flex-wrap: nowrap; }
  .step { padding: 6px 8px; }
  .step + .step::before { display: none; }
  .step-label { display: none; }
  .step[aria-current="step"] .step-label { display: inline; }
  .panel { overflow: visible; }
}
@media (max-width: 640px) {
  .legend { grid-template-columns: 1fr; }
  .audience { grid-template-columns: 1fr; }
  .dialog-title { font-size: 24px; }
}
@media (max-width: 520px) {
  .brand-tag { display: none; }
  .pace-bar span { font-size: 11px; white-space: normal; padding: 6px 1px; line-height: 1.05; }
  .stat-v { font-size: 24px; }
  .stats { gap: 8px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app" data-format="singles">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Recovery Coach</span>
      <div class="seg seg-format" role="group" aria-label="Singles or doubles" id="format">
        <button data-format="singles" aria-pressed="true">Singles</button>
        <button data-format="doubles" aria-pressed="false">Doubles</button>
      </div>
    </div>
    <nav class="steps" id="steps" aria-label="Rally steps">
      <button class="step" data-step="1"><span class="step-num">1</span><span class="step-label">Incoming</span></button>
      <button class="step" data-step="2"><span class="step-num">2</span><span class="step-label">Your shot</span></button>
      <button class="step" data-step="3"><span class="step-num">3</span><span class="step-label">Their options</span></button>
      <button class="step" data-step="4"><span class="step-num">4</span><span class="step-label">Your move</span></button>
    </nav>
    <div class="top-actions">
      <button class="btn btn-play" id="play" aria-label="Play the rally in slow motion"><span class="play-icon" aria-hidden="true"></span><span>Play</span></button>
      <div class="seg" role="group" aria-label="Mode" id="mode">
        <button data-mode="lesson" aria-pressed="true">Lesson</button>
        <button data-mode="predict" aria-pressed="false">Predict</button>
      </div>
      <div class="help-wrap">
        <button class="btn btn-help" id="help" aria-haspopup="menu" aria-expanded="false" aria-label="Help and guide">?</button>
        <div class="help-menu" id="help-menu" role="menu" hidden>
          <button role="menuitem" data-help="welcome">What this app does</button>
          <button role="menuitem" data-help="tour">Take the 1-minute tour</button>
          <button role="menuitem" data-help="legend">What the marks mean</button>
        </div>
      </div>
    </div>
  </header>

  <aside class="panel" id="panel">
    <section class="group">
      <label class="group-title" for="example">Situation</label>
      <select id="example" class="select">
        <option value="">Load an example…</option>
      </select>
    </section>

    <section class="group" id="shot-group">

  shot = solveStudentShot(state, profiles);
  if (withIncoming) incoming = solveIncoming(state);
}

let slowTimer = 0;
function scheduleSlow(delay = 40) {
  stale = true;
  clearTimeout(slowTimer);
  $('busy').hidden = false;
  slowTimer = setTimeout(() => {
    try {
      analysis = shot && shot.ok ? analyse(state, shot, profiles) : null;
    } catch (err) {
      console.error(err);
      analysis = null;
    }
    stale = false;
    $('busy').hidden = true;
    if (ui.mode === 'predict') { ui.guess = null; ui.revealed = false; }
    derive();
    refresh();
  }, delay);
  refresh();
}

/** Turn the analysis into what the screen shows at the current level. */
function derive() {
  plan = null; view = null; featured = { likely: -1, danger: -1 };
  if (!analysis || analysis.outcome !== 'rally') return;
  const rec = analysis.rec, L = ui.level;

  if (analysis.doubles) {
    const tp = teamPlan(rec, L);
    const focus = ui.focus;
    const other = tp.plans[1 - focus].target;
    const owners = replyOwners(rec, tp.plans[0].target, tp.plans[1].target, Math.max(L, 5));
    const n = owners.length || 1;
    const shares = { you: 0, partner: 0, call: 0 };
    analysis.replies.forEach((r, i) => {
      const o = owners[i];
      if (o === 0) shares.you += r.w; else if (o === 1) shares.partner += r.w; else if (o === 2) shares.call += r.w;
    });
    const tot = analysis.replies.reduce((a, r) => a + r.w, 0) || n;
    for (const k of Object.keys(shares)) shares[k] /= tot;
    const p = tp.plans[focus];
    view = {
      plans: tp.plans, focus, tp, shares, owners,
      grid: rec.grid, heat: teamHeat(rec, L, focus, other.x, other.y),
      zones: coverageZones(analysis.replies, owners),
      reach: { x: p.start.x, y: p.start.y, r: travelDistance(p.tMove, p.profile) },
      ceiling: rec.ceiling, tMove: p.tMove, getBack: tp.getBack,
    };
    plan = p;
  } else {
    plan = movePlan(rec, L);
    view = {
      plans: [plan], focus: 0, grid: rec.grid, heat: rec.scores[L],
      reach: { x: state.student.x, y: state.student.y, r: travelDistance(rec.tMove, profiles.student) },
      ceiling: rec.ceiling, tMove: rec.tMove, getBack: plan.getBack,
    };
  }

  // Most likely: the reply that lands nearest the busiest landing cell.
  const d = analysis.density;
  let peak = 0;
  for (let i = 1; i < d.w.length; i++) if (d.w[i] > d.w[peak]) peak = i;
  const px = d.x0 + ((peak % d.nx) + 0.5) * d.cell, py = d.y0 + (Math.floor(peak / d.nx) + 0.5) * d.cell;
  let bestD = Infinity;
  analysis.replies.forEach((r, i) => {
    const dd = Math.hypot(r.landX - px, r.landY - py);
    if (dd < bestD) { bestD = dd; featured.likely = i; }
  });
  // Most dangerous: the reply the recovery spot(s) handle worst.
  let vals;
  if (analysis.doubles) {
    const qa = cellOf(view.plans[0].target.x, view.plans[0].target.y), qb = cellOf(view.plans[1].target.x, view.plans[1].target.y);
    vals = analysis.replies.map((_, r) => Math.max(rec.V[0][rec.at(0, qa) + r], rec.V[1][rec.at(0, qb) + r]));
  } else {
    vals = replyValues(rec, plan.target.x, plan.target.y, 0);
  }
  let worst = -1;
  vals.forEach((v, i) => { if (i !== featured.likely && (worst < 0 || v < vals[worst])) worst = i; });
  featured.danger = worst;
}

function recomputeAll() {
  computeFast();
  scheduleSlow();
  saveState();
}

// ---------------------------------------------------------------- drawing

let drawQueued = false;
function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}

function sizeCanvas(canvas, ctx) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

function scene() {
  const showAnswer = ui.mode === 'lesson' || ui.revealed;
  const an = stale ? null : analysis;
  return {
    state, step: anim ? anim.step : ui.step, layers: ui.layers, incoming, shot, analysis: an,
    view: an && an.outcome === 'rally' ? view : null,
    showAnswer: showAnswer && !anim, level: ui.level, guess: ui.guess, featured,
    anim: anim ? anim.frame : null,
    doubles: doubles(), hitter: hitterOf(state), partnerHits: partnerHits(state),
    oppReach: profiles.opponent.reach,
    hideIncoming: drag && ['you', 'partner', 'opp', 'opp2', 'contact'].includes(drag.kind),
  };
}

function draw() {
  const [cw, ch] = sizeCanvas(court, cctx);
  const [sw, sh] = sizeCanvas(side, sctx);
  cv = courtView(cw, ch);
  if (!drag) {
    let zTop = Math.max(hitterOf(state).z + 2, 8);
    if (shot && shot.ok) for (let i = 0; i < shot.path.n; i++) zTop = Math.max(zTop, shot.path.z[i] + 1.5);
    sideZMax = Math.min(24, Math.ceil(zTop));
  }
  sv = sideView(sw, sh, cv, sideZMax);
  const s = scene();
  drawCourt(cctx, cv, theme, s);
  drawSide(sctx, sv, theme, s);
}

// ---------------------------------------------------------------- UI text

function fmt(v, d = 1) { return Number.isFinite(v) ? v.toFixed(d) : '–'; }
const pressed = (sel, attr, value) => document.querySelectorAll(sel).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === value)));

function refresh() {
  $('app').dataset.format = state.format;
  document.querySelectorAll('.step').forEach((b) => {
    const n = Number(b.dataset.step);
    const cur = anim ? anim.step : ui.step;
    if (n === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.classList.toggle('done', n < cur);
  });
  pressed('#format button', 'format', state.format);
  pressed('#mode button', 'mode', ui.mode);
  pressed('#hitter button', 'hitter', state.hitter);
  pressed('#focus button', 'focus', ui.focus === 1 ? 'partner' : 'you');
  pressed('.shot-btn', 'shot', state.shotId);
  $('shot-blurb').textContent = shotById(state.shotId).blurb;
  pressed('#rule button', 'rule', state.rule);
  document.querySelectorAll('#incoming button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.incoming === (state.rule === 'return' ? 'bounce' : state.incoming)));
    b.disabled = state.rule === 'return';
  });
  $('rule-hint').textContent = state.rule === 'return'
    ? 'The serve bounced before it was hit, and the return must bounce before the serving team can play it.'
    : 'Anyone can volley from outside the kitchen.';
  $('opp-label').textContent = doubles() ? 'Opponent A' : 'Opponent';

  for (const [id, v] of [['student', state.studentSkill], ['opp', state.oppSkill], ['partner', state.partnerSkill], ['opp2', state.opp2Skill]]) {
    setRating(`o-${id}`, v);
    $(`r-${id}`).value = v;
  }
  setRating('o-move', state.linkMove ? state.studentSkill : state.studentMove);
  $('r-move').value = state.linkMove ? state.studentSkill : state.studentMove;
  $('r-move').disabled = state.linkMove;
  $('link-move').checked = state.linkMove;

  refreshAmbition();
  refreshSummary();
  requestDraw();
}

function setRating(id, v) {
  const o = $(id);
  o.textContent = v.toFixed(1);
  o.classList.toggle('pro', v >= PRO_RATING);
}

function refreshAmbition() {
  const v = !stale && view ? view : null;
  // Keep the thumb inside the track: positions run from 26px to (height - 26px).
  const at = (f) => `calc(26px + (100% - 52px) * ${clamp(f, 0, 1).toFixed(4)})`;
  const f = ui.level / (LEVELS - 1);
  $('amb-thumb').style.bottom = at(f);
  $('amb-fill').style.height = at(f);
  $('amb-val').textContent = String(ui.level);
  $('amb').setAttribute('aria-valuenow', String(ui.level));
  const ceil = $('amb-ceiling'), over = $('amb-over');
  ceil.querySelector('span').textContent = doubles() ? 'Team ceiling' : 'Your ceiling';
  const hide = !v || v.ceiling >= LEVELS - 1 || (ui.mode === 'predict' && !ui.revealed);
  ceil.hidden = hide; over.hidden = hide;
  let isOver = false;
  if (!hide) {
    const pos = clamp((v.ceiling + 0.5) / (LEVELS - 1), 0, 1);
    ceil.style.bottom = at(pos);
    over.style.height = `calc(100% - ${at(pos)})`;
    isOver = ui.level > v.ceiling;
    ceil.classList.toggle('below', isOver);
  }
  $('amb').setAttribute('aria-valuetext', `Level ${ui.level} of ${LEVELS - 1}${isOver ? ', above the ceiling' : ''}`);
  $('amb-thumb').classList.toggle('over', isOver);
}

function refreshSummary() {
  const rally = !stale && analysis && analysis.outcome === 'rally' && view;
  const showAnswer = ui.mode === 'lesson' || ui.revealed;
  const show = rally && showAnswer && ui.step >= 4 && plan;
  $('s-time').textContent = rally && ui.step >= 3 ? `${fmt(view.tMove, 2)} s` : '–';
  $('s-dist').textContent = show ? `${Math.round(plan.idealDist)} ft` : '–';
  $('s-steps').textContent = show ? String(plan.idealPace.steps) : '–';
  $('s-ret-k').textContent = doubles() ? 'Team returns' : 'Replies returned';
  $('s-ret').textContent = show ? `${Math.round(view.getBack * 100)}%` : '–';
  const order = ['walk', 'jog', 'shuffle', 'sprint', 'impossible'];
  const k = order.indexOf(show ? plan.idealPace.level.key : null);
  document.querySelectorAll('#pace-bar span').forEach((sp, i) => {
    sp.classList.toggle('on', i === k);
    sp.classList.toggle('lit', k >= 0 && i < k);
  });

  // Coach's note
  const parts = [];
  const step = anim ? anim.step : ui.step;
  const pHits = partnerHits(state);
  const h = hitterOf(state);
  if (incoming) {
    const who = pHits ? 'your partner, who takes' : 'you and you take';
    parts.push([1, `The ball comes to ${who} it ${incoming.kind === 'volley' ? 'in the air' : 'after the bounce'} at ${h.z.toFixed(1)} ft, ${zoneName(h.y)}.`]);
  }
  if (shot && shot.ok && step >= 2) {
    let t = shotSummary(shot);
    if (pHits) t = t.replace(/^Your /, "Your partner's ");
    const hp = pHits ? profiles.partner : profiles.student;
    const skill = pHits ? state.partnerSkill : state.studentSkill;
    if (shot.tooFast) t += ` That is more pace than a typical ${skill.toFixed(1)} can produce (about ${Math.round(hp.maxDrive)} mph).`;
    parts.push([2, t]);
  }
  if (step >= 3 && !stale && analysis) parts.push([3, analysis.doubles || doubles() ? doublesOpponentSummary(analysis) : opponentSummary(analysis)]);
  if (step >= 4 && show) parts.push([4, analysis.doubles ? doublesMoveSummary(view.tp, view.shares) : moveSummary(plan, ui.level, LEVELS)]);
  const note = $('note');
  note.innerHTML = '';
  parts.forEach(([n, t], i) => {
    const span = document.createElement(n === step ? 'b' : 'span');
    span.textContent = (i ? ' ' : '') + t;
    note.appendChild(span);
  });
  if (stale) note.appendChild(Object.assign(document.createElement('span'), { textContent: parts.length ? ' Working out their options…' : 'Working out their options…' }));

  // Banner
  const banner = $('banner');
  let msg = null, warn = false;
  if (shot && !shot.ok) { msg = 'That shot is not possible from here. Raise the net clearance or move the target.'; warn = true; }
  else if (!stale && analysis && analysis.outcome !== 'rally' && ui.step >= 3) msg = opponentSummary(analysis);
  banner.hidden = !msg;
  if (msg) { banner.textContent = msg; banner.classList.toggle('warn', warn); }

  // Predict panel
  const predict = $('predict');
  predict.hidden = !(ui.mode === 'predict' && ui.step >= 4);
  if (!predict.hidden) {
    $('reveal').disabled = !ui.guess || !rally;
    $('reveal').hidden = ui.revealed;
    $('retry').hidden = !ui.revealed;
    $('predict-text').textContent = predictText(rally);
  }
  $('play').disabled = !(shot && shot.ok) || (ui.mode === 'predict' && !ui.revealed);
}

function predictText(rally) {
  if (!rally) return 'This shot does not lead to a rally. Pick another shot to quiz on.';
  if (!ui.guess) return doubles()
    ? 'Where should YOU be when they hit it? Tap your spot (the teal player).'
    : 'Where should you be when they hit it? Tap your side of the court.';
  if (!ui.revealed) return 'Happy with that spot? Reveal the answer, or tap again to move it.';
  const rec = analysis.rec, g = ui.guess;
  const me = view.plans[0];
  let yours, lvl;
  if (analysis.doubles) {
    const mate = view.plans[1].target;
    yours = teamScoreAt(rec, 0, g, mate);
    lvl = teamScoreAt(rec, ui.level, g, mate) / (me.idealScore || 1);
  } else {
    yours = scoreAt(rec, 0, g.x, g.y);
    lvl = scoreAt(rec, ui.level, g.x, g.y) / (me.ideal.score || 1);
  }
  const off = Math.hypot(g.x - me.ideal.x, g.y - me.ideal.y);
  const inTime = travelTime(Math.hypot(g.x - me.start.x, g.y - me.start.y), profiles.student) <= view.plans[0].tMove;
  const dir = describeDirection(me.ideal.x - g.x, me.ideal.y - g.y);
  const who = analysis.doubles ? 'your team returns' : 'you return';
  return `From your spot ${who} ${Math.round(yours * 100)}% of their likely replies (best ${Math.round(view.getBack * 100)}%), `
    + `scoring ${Math.round(Math.min(1, lvl) * 100)}% of the best at this ambition level. `
    + (off < 1.5 ? 'You were right on it. ' : `The best spot is ${dir} of your guess. `)
    + (inTime ? 'You could get there in time.' : 'You could not get there in time.');
}

// ---------------------------------------------------------------- controls

function fillExamples() {
  const sel = $('example');
  sel.length = 1;
  examples().forEach((ex, i) => {
    const o = document.createElement('option');
    o.value = String(i); o.textContent = ex.name;
    sel.appendChild(o);
  });
}

const KEEP = ['studentSkill', 'studentMove', 'linkMove', 'oppSkill', 'partnerSkill', 'opp2Skill', 'format'];

function setFormat(f) {
  if (f === state.format) return;
  stopPlay();
  state.format = f;
  if (f === 'doubles') {
    const ok = state.partner && state.partner.y < 0 && state.opponent2 && state.opponent2.y > 0
      && Math.hypot(state.partner.x - state.student.x, state.partner.y - state.student.y) >= 3
      && Math.hypot(state.opponent2.x - state.opponent.x, state.opponent2.y - state.opponent.y) >= 3;
    if (!ok) state = withDoublesPositions(state);
  }
  ui.focus = 0; ui.guess = null; ui.revealed = false;
  fillExamples();
  recomputeAll();
}

function buildControls() {
  const shots = $('shots');
  for (const s of SHOTS) {
    const b = document.createElement('button');
    b.className = 'shot-btn'; b.dataset.shot = s.id; b.textContent = s.name; b.type = 'button';
    b.addEventListener('click', () => selectShot(s.id));
    shots.appendChild(b);
  }
  fillExamples();
  const sel = $('example');
  sel.addEventListener('change', () => {
    if (sel.value === '') return;
    const ex = examples()[Number(sel.value)];
    const keep = Object.fromEntries(KEEP.map((k) => [k, state[k]]));
    state = { ...structuredClone(DEFAULT_STATE), ...structuredClone(ex.state), ...keep };
    sel.value = '';
    ui.guess = null; ui.revealed = false;
    recomputeAll();
  });

  document.querySelectorAll('#format button').forEach((b) => b.addEventListener('click', () => setFormat(b.dataset.format)));
  document.querySelectorAll('#hitter button').forEach((b) => b.addEventListener('click', () => {
    if (state.hitter === b.dataset.hitter) return;
    state.hitter = b.dataset.hitter;
    ui.guess = null; ui.revealed = false;
    recomputeAll();
  }));
  document.querySelectorAll('#focus button').forEach((b) => b.addEventListener('click', () => {
    ui.focus = b.dataset.focus === 'partner' ? 1 : 0;
    derive();
    refresh();
  }));
  document.querySelectorAll('.step').forEach((b) => b.addEventListener('click', () => {
    stopPlay();
    ui.step = Number(b.dataset.step);
    refresh();
  }));
  document.querySelectorAll('#mode button').forEach((b) => b.addEventListener('click', () => {
    stopPlay();
    ui.mode = b.dataset.mode;
    ui.guess = null; ui.revealed = false;
    if (ui.mode === 'predict') ui.step = 4;
    refresh();
  }));
  document.querySelectorAll('#rule button').forEach((b) => b.addEventListener('click', () => { state.rule = b.dataset.rule; recomputeAll(); }));
  document.querySelectorAll('#incoming button').forEach((b) => b.addEventListener('click', () => { state.incoming = b.dataset.incoming; computeFast(); refresh(); saveState(); }));

  const rating = (id, apply) => {
    let t = 0;
    $(id).addEventListener('input', (e) => {
      apply(Number(e.target.value));
      computeFast({ withIncoming: false });
      stale = true;
      refresh();
      clearTimeout(t);
      t = setTimeout(() => { scheduleSlow(0); saveState(); }, 250);
    });
  };
  rating('r-student', (v) => { state.studentSkill = v; });
  rating('r-move', (v) => { state.studentMove = v; });
  rating('r-opp', (v) => { state.oppSkill = v; });
  rating('r-partner', (v) => { state.partnerSkill = v; });
  rating('r-opp2', (v) => { state.opp2Skill = v; });
  $('link-move').addEventListener('change', (e) => {
    state.linkMove = e.target.checked;
    if (!state.linkMove) state.studentMove = state.studentSkill;
    recomputeAll();
  });

  for (const [id, key] of [['l-heat', 'heat'], ['l-fan', 'fan'], ['l-zones', 'zones'], ['l-split', 'split']]) {
    $(id).addEventListener('change', (e) => { ui.layers[key] = e.target.checked; requestDraw(); });
  }

  $('reveal').addEventListener('click', () => { ui.revealed = true; refresh(); });
  $('retry').addEventListener('click', () => { ui.guess = null; ui.revealed = false; refresh(); });
  $('play').addEventListener('click', () => (anim ? stopPlay() : startPlay()));

  setupAmbition();
  setupCourtDrag();
  setupSideDrag();
}

function selectShot(id) {
  const s = shotById(id);
  const h = hitterOf(state);
  state.shotId = id;
  state.target = s.target(h);
  state.clearance = s.clearance;
  if (id === 'overhead' && h.z < 6) h.z = 7.5;
  if (id !== 'overhead' && h.z > 6.5) h.z = 3;
  ui.guess = null; ui.revealed = false;
  recomputeAll();
}

function setupAmbition() {
  const track = $('amb');
  const setFromY = (clientY) => {
    const r = track.getBoundingClientRect();
    const f = 1 - (clientY - r.top - 26) / Math.max(1, r.height - 52);
    setLevel(Math.round(clamp(f, 0, 1) * (LEVELS - 1)));
  };
  let active = false;
  track.addEventListener('pointerdown', (e) => { active = true; track.setPointerCapture(e.pointerId); setFromY(e.clientY); });
  track.addEventListener('pointermove', (e) => { if (active) setFromY(e.clientY); });
  track.addEventListener('pointerup', () => { active = false; });
  track.addEventListener('pointercancel', () => { active = false; });
  track.addEventListener('keydown', (e) => {
    const map = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 2, PageDown: -2 };
    if (e.key in map) { setLevel(clamp(ui.level + map[e.key], 0, LEVELS - 1)); e.preventDefault(); }
    if (e.key === 'Home') { setLevel(0); e.preventDefault(); }
    if (e.key === 'End') { setLevel(LEVELS - 1); e.preventDefault(); }
  });
}

function setLevel(L) {
  if (L === ui.level) return;
  ui.level = L;
  if (ui.mode === 'lesson' && ui.step < 4) ui.step = 4;
  derive();
  refresh();
}

function pointerPos(canvas, e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

function courtHandles() {
  const hs = [['you', state.student], ['opp', state.opponent]];
  if (doubles()) hs.push(['partner', state.partner], ['opp2', state.opponent2]);
  if (ui.step >= 2) hs.push(['target', state.target]);
  return hs;
}

function setupCourtDrag() {
  court.addEventListener('pointerdown', (e) => {
    if (anim) return;
    const [px, py] = pointerPos(court, e);
    let best = null, bestD = 34;
    for (const [kind, p] of courtHandles()) {
      const d = Math.hypot(cv.sx(p.y) - px, cv.sy(p.x) - py);
      if (d < bestD) { bestD = d; best = kind; }
    }
    if (best) {
      drag = { kind: best, x0: px, y0: py, moved: false };
      court.setPointerCapture(e.pointerId);
      e.preventDefault();
      return;
    }
    const c = cv.toCourt(px, py);
    if (ui.mode === 'predict' && ui.step >= 4 && !ui.revealed && c.y < 0) {
      ui.guess = { x: clamp(c.x, -13, 13), y: clamp(c.y, -27, -0.3) };
      refresh();
    }
  });
  court.addEventListener('pointermove', (e) => {
    const [px, py] = pointerPos(court, e);
    if (!drag) {
      court.style.cursor = courtHandles().some(([, p]) => Math.hypot(cv.sx(p.y) - px, cv.sy(p.x) - py) < 34) ? 'grab' : 'default';
      return;
    }
    if (!drag.moved && Math.hypot(px - drag.x0, py - drag.y0) < 6) return; // still a tap
    drag.moved = true;
    const c = cv.toCourt(px, py);
    const near = (p) => { p.x = clamp(c.x, -13, 13); p.y = clamp(c.y, -27, -0.5); };
    const far = (p) => { p.x = clamp(c.x, -13, 13); p.y = clamp(c.y, 0.5, 27); };
    if (drag.kind === 'you') near(state.student);
    if (drag.kind === 'partner') near(state.partner);
    if (drag.kind === 'opp') far(state.opponent);
    if (drag.kind === 'opp2') far(state.opponent2);
    if (drag.kind === 'target') far(state.target);
    computeFast({ withIncoming: false });
    stale = true;
    ui.guess = null; ui.revealed = false;
    refresh();
  });
  const end = () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (!d.moved) {
      // In Predict mode a tap is always a guess, even on a player ("stay here").
      const c = cv.toCourt(d.x0, d.y0);
      if (ui.mode === 'predict' && ui.step >= 4 && !ui.revealed && c.y < 0) {
        ui.guess = { x: clamp(c.x, -13, 13), y: clamp(c.y, -27, -0.3) };
        refresh();
        return;
      }
      // A tap on your team picks whose numbers and heat map to show.
      if (doubles() && (d.kind === 'you' || d.kind === 'partner')) {
        ui.focus = d.kind === 'partner' ? 1 : 0;
        derive();
      }
      refresh();
      return;
    }
    recomputeAll();
  };
  court.addEventListener('pointerup', end);
  court.addEventListener('pointercancel', end);
}

function setupSideDrag() {
  side.addEventListener('pointerdown', (e) => {
    if (anim) return;
    const [px, py] = pointerPos(side, e);
    const h = hitterOf(state);
    const hs = [['contact', sv.sx(h.y), sv.sz(h.z)]];
    if (shot && shot.ok && ui.step >= 2) hs.push(['net', sv.sx(0), sv.sz(shot.zNet)]);
    let best = null, bestD = 30;
    for (const [kind, x, y] of hs) {
      const d = Math.hypot(x - px, y - py);
      if (d < bestD) { bestD = d; best = kind; }
    }
    if (!best) return;
    drag = { kind: best, xCross: shot && shot.ok ? shot.xCross : 0, moved: true };
    side.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  side.addEventListener('pointermove', (e) => {
    const [px, py] = pointerPos(side, e);
    const h = hitterOf(state);
    if (!drag) {
      const near = (x, y) => Math.hypot(x - px, y - py) < 30;
      side.style.cursor = near(sv.sx(h.y), sv.sz(h.z)) || (shot && shot.ok && near(sv.sx(0), sv.sz(shot.zNet))) ? 'ns-resize' : 'default';
      return;
    }
    const z = sv.toZ(py);
    if (drag.kind === 'contact') h.z = clamp(Math.round(z * 10) / 10, 0.3, 8.5);
    if (drag.kind === 'net') state.clearance = clamp(z - netHeight(drag.xCross) - BALL_R, 0.05, 18);
    computeFast({ withIncoming: false });
    stale = true;
    refresh();
  });
  const end = () => { if (!drag) return; drag = null; recomputeAll(); };
  side.addEventListener('pointerup', end);
  side.addEventListener('pointercancel', end);
}

// ---------------------------------------------------------------- playback

function startPlay() {
  if (!shot || !shot.ok) return;
  const rally = !stale && analysis && analysis.outcome === 'rally';
  const tA = incoming ? incoming.path.t[incoming.path.n - 1] : 0;
  const tB = rally ? analysis.main.t : shot.path.t[shot.path.n - 1];
  const reply = rally && featured.likely >= 0 ? analysis.replies[featured.likely] : null;
  const tC = reply ? reply.path.t[reply.path.n - 1] - reply.contact.t : 0;
  const receiver = rally && analysis.main.who === 1 ? 'opp2' : 'opp';
  const recvPos = receiver === 'opp2' ? state.opponent2 : state.opponent;
  let body = { x: recvPos.x, y: recvPos.y };
  if (rally) {
    const c = analysis.main;
    const dx = recvPos.x - c.x, dy = recvPos.y - c.y, d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, profiles.opponent.reach / d);
    body = { x: c.x + dx * k, y: c.y + dy * k };
  }
  anim = { t0: performance.now(), slow: 0.45, tA, tB, tC, reply, rally, receiver, body, step: 1, frame: null };
  $('play').classList.add('playing');
  $('play').querySelector('span:last-child').textContent = 'Stop';
  requestAnimationFrame(tick);
}

function stopPlay() {
  if (!anim) return;
  anim = null;
  $('play').classList.remove('playing');
  $('play').querySelector('span:last-child').textContent = 'Play';
  ui.step = 4;
  refresh();
}

function moveToward(from, to, dist) {
  const dx = to.x - from.x, dy = to.y - from.y, d = Math.hypot(dx, dy);
  if (d < 1e-6 || dist <= 0) return { x: from.x, y: from.y };
  const f = Math.min(1, dist / d);
  return { x: from.x + dx * f, y: from.y + dy * f };
}

function tick(now) {
  if (!anim) return;
  const a = anim;
  const T = ((now - a.t0) / 1000) * a.slow;
  const pHits = partnerHits(state);
  const you0 = { x: state.student.x, y: state.student.y };
  const mate0 = { x: state.partner.x, y: state.partner.y };
  const opp0 = { x: state.opponent.x, y: state.opponent.y };
  const opp20 = { x: state.opponent2.x, y: state.opponent2.y };
  const plans = view ? view.plans : [];
  const youTarget = plans[0] ? plans[0].target : you0;
  const mateTarget = plans[1] ? plans[1].target : mate0;
  const ps = profiles.student, pp = profiles.partner, po = profiles.opponent;
  const lag = (hits, p) => (hits ? p.followThrough : 0.1);
  const youAt = (t) => moveToward(you0, youTarget, travelDistance(t - lag(!pHits, ps), ps));
  const mateAt = (t) => moveToward(mate0, mateTarget, travelDistance(t - lag(pHits, pp), pp));
  const runner = (t, from) => moveToward(from, a.body, travelDistance(t - po.reaction, po));
  const opps = (t) => ({
    opp: a.rally && a.receiver === 'opp' ? runner(t, opp0) : opp0,
    opp2: a.rally && a.receiver === 'opp2' ? runner(t, opp20) : opp20,
  });
  let frame;
  if (T < a.tA && incoming) {
    a.step = 1;
    frame = { ball: posAt(incoming.path, T), you: you0, partner: mate0, opp: opp0, opp2: opp20 };
  } else if (T < a.tA + a.tB) {
    const t = T - a.tA;
    a.step = t < a.tB - 0.05 ? 2 : 3;
    const you = youAt(t);
    frame = { ball: posAt(shot.path, t), you, partner: mateAt(t), ...opps(t), ring: a.rally ? 1 - t / a.tB : null, ringAt: you };
  } else if (a.reply && T < a.tA + a.tB + a.tC) {
    const t = T - a.tA - a.tB;
    a.step = 3;
    frame = { ball: posAt(a.reply.path, a.reply.contact.t + t), you: youAt(a.tB), partner: mateAt(a.tB), ...opps(a.tB) };
  } else if (T < a.tA + a.tB + a.tC + 0.5) {
    a.step = a.rally ? 3 : 2;
    frame = { ball: null, you: youAt(a.tB), partner: mateAt(a.tB), ...opps(a.tB) };
  } else {
    stopPlay();
    return;
  }
  a.frame = frame;
  refreshSteps();
  draw();
  requestAnimationFrame(tick);
}

function refreshSteps() {
  document.querySelectorAll('.step').forEach((b) => {
    const n = Number(b.dataset.step);
    if (n === anim.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.classList.toggle('done', n < anim.step);
  });
}

// ---------------------------------------------------------------- boot

function boot() {
  buildControls();
  new ResizeObserver(() => requestDraw()).observe($('stage'));
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const retheme = () => { theme = readTheme(); requestDraw(); };
  mq.addEventListener?.('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  initGuide({
    isDoubles: doubles,
    beforeTour: () => {
      stopPlay();
      ui.mode = 'lesson'; ui.step = 4; ui.guess = null; ui.revealed = false;
      refresh();
    },
  });
  computeFast();
  refresh();
  $('busy').textContent = 'Loading the physics…';
  scheduleSlow(60);
  setTimeout(() => { $('busy').textContent = 'Calculating…'; }, 200);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { theme = readTheme(); requestDraw(); });
boot();

return {  };
})();

})();
</script>
